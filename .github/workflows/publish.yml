name: Publish

# The image is published on a pushed release tag, never on a branch push and
# never on a pull request (T13, S8; L109 decision 1).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Build, push and sign
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/almali-dev/almali-library-curator
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push the multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the pushed digest
        run: cosign sign --yes ghcr.io/almali-dev/almali-library-curator@${{ steps.build.outputs.digest }}

name: CI

on:
  push:
    branches: [main, feature/almali-library-curator-v1]
    tags: ["v*"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --require-hashes -r docker/build-requirements.lock
          python -m pip install --require-hashes -r docker/requirements.lock
          python -m pip install pytest PyYAML
          python -m pip install --no-deps --no-build-isolation -e ".[dev]"
          python -m pip check
      - name: Test
        run: python -m pytest

  audit:
    name: Audit locked runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit --disable-pip --no-deps -r docker/requirements.lock

  docker:
    name: Build and boot the image
    runs-on: ubuntu-latest
    env:
      ALC_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install container test runner
        run: python -m pip install pytest
      - name: Build and boot
        run: |
          docker info
          python -m pytest tests/packaging/test_docker_container.py

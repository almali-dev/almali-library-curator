[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-curator-for-plex"
version = "0.1.0"
description = "Shows what nobody watches in a Plex library and removes only what the owner marks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Flask>=3.1",
    "Flask-WTF>=1.2",
    "gunicorn>=25.0",
    "requests>=2.31",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["library_curator*"]

[tool.setuptools.package-data]
library_curator = ["i18n/*.json", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

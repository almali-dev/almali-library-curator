[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almali-library-curator"
version = "0.34.0"
description = "Almali Library Curator for Plex: shows what nobody watches in a Plex library and removes only what the owner marks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Flask>=3.1,<4",
    "Flask-WTF>=1.2,<2",
    "gunicorn>=25,<26",
    "requests>=2.33,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "psutil>=7.2,<8",
    "cryptography>=46,<51",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "PyYAML==6.0.2",
    "pytest-xdist==3.7.0",
    "ruff==0.11.13",
    "pyright==1.1.401",
]
browser = [
    "playwright==1.65.2",
]

[tool.setuptools.packages.find]
include = ["almali_library_curator*"]

[tool.setuptools.package-data]
almali_library_curator = [
    "i18n/*.json",
    "templates/**/*.html",
    "web/templates/**/*.html",
    "static/**/*",
]

# Initial correctness-only baseline; see CONTRIBUTING.md before tightening.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
